<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>India Shipping Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c1:#3b6aea;--c2:#16a34a;--c3:#e53e3e;--c4:#d97706;--c5:#7c3aed;
  --bg:#eef2fa;--bg2:#dde4f0;
  --surface:rgba(255,255,255,0.80);--surface2:rgba(255,255,255,0.60);
  --border:rgba(148,163,184,0.40);--border-h:#94a3b8;
  --text:#0f172a;--muted:#4b5563;--dim:#94a3b8;
  --r:16px;
  --shadow:0 1px 4px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  --shadow-h:0 6px 28px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.06);
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 700px 500px at 5% 15%,rgba(59,106,234,.07) 0%,transparent 70%),
    radial-gradient(ellipse 500px 400px at 95% 85%,rgba(22,163,74,.05) 0%,transparent 70%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(148,163,184,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.1) 1px,transparent 1px);
  background-size:52px 52px;
}
.page{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:1rem 1.2rem 3rem}

/* HEADER */
.hdr{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.6rem;
  background:rgba(255,255,255,0.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(255,255,255,0.95);border-bottom:1px solid var(--border);
  border-radius:var(--r);padding:.8rem 1.2rem;
  box-shadow:var(--shadow);margin-bottom:.9rem;
}
.brand{display:flex;align-items:center;gap:.8rem}
.flag{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;overflow:hidden;
  background:linear-gradient(180deg,#FF9933 33.33%,#fff 33.33% 66.66%,#138808 66.66%);
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.brand-text h1{font-size:1rem;font-weight:700;letter-spacing:-.025em;color:var(--text);line-height:1.1}
.brand-text p{font-size:.58rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-top:.1rem}
.hdr-r{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.filt{display:flex;gap:.15rem;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:3px}
.fbtn{
  font-family:'DM Sans',sans-serif;font-size:.65rem;font-weight:600;background:transparent;border:none;
  color:var(--muted);padding:.26rem .72rem;border-radius:7px;cursor:pointer;transition:all .18s;letter-spacing:.02em;
}
.fbtn.on{background:var(--c1);color:#fff;box-shadow:0 2px 10px rgba(59,106,234,.35)}
.fbtn:not(.on):hover{color:var(--c1);background:rgba(59,106,234,.08)}
.upload-btn{
  display:flex;align-items:center;gap:.35rem;font-family:'DM Sans',sans-serif;font-size:.65rem;font-weight:600;
  background:rgba(22,163,74,.07);border:1px solid rgba(22,163,74,.22);color:var(--c2);
  border-radius:9px;padding:.3rem .85rem;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.upload-btn:hover{background:rgba(22,163,74,.13);border-color:rgba(22,163,74,.4)}
.upload-btn input{display:none}
.clk{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:.28rem .7rem;white-space:nowrap;}
.data-badge{display:none;font-size:.58rem;font-weight:600;color:var(--c2);background:rgba(22,163,74,.07);border:1px solid rgba(22,163,74,.18);border-radius:20px;padding:.2rem .6rem;font-family:'DM Mono',monospace;}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem;margin-bottom:.8rem}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.kpi-grid{grid-template-columns:1fr 1fr}}
.kpi{
  background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.88);border-bottom:1px solid var(--border);
  border-radius:var(--r);padding:.95rem 1rem .85rem;
  position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
  box-shadow:var(--shadow);
}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0;}
.kpi.k1::before{background:linear-gradient(90deg,#3b6aea,#7ba3ff)}
.kpi.k2::before{background:linear-gradient(90deg,#16a34a,#4ade80)}
.kpi.k3::before{background:linear-gradient(90deg,#e53e3e,#fc8181)}
.kpi.k4::before{background:linear-gradient(90deg,#d97706,#fbbf24)}
.kpi.k5::before{background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.kpi:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 16px 36px rgba(59,106,234,.14),0 6px 16px rgba(0,0,0,.08)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.kpi-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.95rem;}
.kpi.k1 .kpi-ico{background:rgba(59,106,234,.1)}.kpi.k2 .kpi-ico{background:rgba(22,163,74,.1)}
.kpi.k3 .kpi-ico{background:rgba(229,62,62,.1)}.kpi.k4 .kpi-ico{background:rgba(217,119,6,.1)}.kpi.k5 .kpi-ico{background:rgba(124,58,237,.1)}
.kpi-bdg{font-size:.53rem;font-weight:700;padding:.1rem .4rem;border-radius:20px;font-family:'DM Mono',monospace;letter-spacing:.02em}
.kpi.k1 .kpi-bdg{background:rgba(59,106,234,.1);color:var(--c1)}.kpi.k2 .kpi-bdg{background:rgba(22,163,74,.1);color:var(--c2)}
.kpi.k3 .kpi-bdg{background:rgba(229,62,62,.1);color:var(--c3)}.kpi.k4 .kpi-bdg{background:rgba(217,119,6,.1);color:var(--c4)}.kpi.k5 .kpi-bdg{background:rgba(124,58,237,.1);color:var(--c5)}
.kpi-lbl{font-size:.55rem;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:600;margin-bottom:.18rem}
.kpi-val{font-size:1.4rem;font-weight:700;letter-spacing:-.03em;line-height:1}
.kpi.k1 .kpi-val{color:var(--c1)}.kpi.k2 .kpi-val{color:var(--c2)}.kpi.k3 .kpi-val{color:var(--c3)}.kpi.k4 .kpi-val{color:var(--c4)}.kpi.k5 .kpi-val{color:var(--c5)}
.kpi-sub{font-size:.57rem;color:var(--dim);margin-top:.22rem}
.kpi-bw{height:3px;border-radius:2px;background:rgba(0,0,0,.06);margin-top:.7rem;overflow:hidden}
.kpi-bar{height:100%;border-radius:2px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.kpi.k1 .kpi-bar{background:linear-gradient(90deg,#3b6aea,#7ba3ff)}.kpi.k2 .kpi-bar{background:linear-gradient(90deg,#16a34a,#4ade80)}
.kpi.k3 .kpi-bar{background:linear-gradient(90deg,#e53e3e,#fc8181)}.kpi.k4 .kpi-bar{background:linear-gradient(90deg,#d97706,#fbbf24)}.kpi.k5 .kpi-bar{background:linear-gradient(90deg,#7c3aed,#a78bfa)}

/* CARD */
.card{
  background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.88);border-bottom:1px solid var(--border);
  border-radius:var(--r);padding:1rem 1.1rem;
  box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s;overflow:hidden;
}
.card:hover{box-shadow:var(--shadow-h)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem;flex-wrap:wrap;gap:.35rem}
.ct{font-size:.78rem;font-weight:700;letter-spacing:-.02em;color:var(--text);display:flex;align-items:center;gap:.35rem}
.ct-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.cbdg{font-size:.53rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:.1rem .48rem;border-radius:20px;background:var(--bg2);color:var(--muted);border:1px solid var(--border);font-family:'DM Mono',monospace;}

/* LAYOUT */
.row{display:grid;gap:.7rem;margin-bottom:.7rem}
.r3{grid-template-columns:1fr 1fr 1fr}.r2{grid-template-columns:1fr 1fr}.r21{grid-template-columns:1.3fr 1fr}.r12{grid-template-columns:1fr 1.3fr}
@media(max-width:980px){.r3{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.r3,.r2,.r21,.r12{grid-template-columns:1fr}}

.sec{font-size:.56rem;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);font-weight:700;margin:.15rem 0 .6rem;display:flex;align-items:center;gap:.35rem;}
.sec::before{content:'';display:inline-block;width:10px;height:2px;background:var(--c1);border-radius:2px}

/* DONUT LEGEND */
.dl{display:flex;flex-direction:column;gap:.25rem;margin-top:.6rem}
.dl-r{display:flex;align-items:center;gap:.38rem;cursor:pointer;padding:.2rem .38rem;border-radius:7px;transition:background .15s,transform .15s;}
.dl-r:hover{background:rgba(0,0,0,.04);transform:translateX(3px)}
.dl-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;transition:transform .15s}
.dl-r:hover .dl-dot{transform:scale(1.35)}
.dl-lbl{font-size:.64rem;color:var(--muted);flex:1;font-weight:500}
.dl-cnt{font-family:'DM Mono',monospace;font-size:.63rem;color:var(--text);font-weight:500}
.dl-pct{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--dim);margin-left:.08rem}

.donut-wrap{position:relative;height:240px;width:100%;display:flex;align-items:center;justify-content:center;}

/* STATE GRID */
.state-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:.4rem;}
.st-cell{border-radius:9px;padding:.44rem .48rem;cursor:pointer;transition:all .18s;border:1px solid transparent;position:relative;}
.st-cell:hover{border-color:var(--border-h);transform:translateY(-2px) scale(1.03);box-shadow:var(--shadow-h)}
.st-name{font-size:.54rem;color:rgba(255,255,255,.88);margin-bottom:.15rem;font-weight:500;line-height:1.2}
.st-val{font-size:.65rem;font-family:'DM Mono',monospace;font-weight:700;color:#fff}

/* HEATMAP */
.hm-wrap{overflow-x:auto;margin-top:.25rem}
.hm-table{width:100%;border-collapse:separate;border-spacing:4px}
.hm-table th{font-size:.55rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:.32rem .4rem;text-align:center;}
.hm-table td{border-radius:8px;padding:.5rem .38rem;text-align:center;font-size:.6rem;font-family:'DM Mono',monospace;font-weight:600;cursor:pointer;transition:transform .14s,box-shadow .14s;}
.hm-table td:not(.hml):hover{transform:scale(1.07);box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:2;position:relative;}
.hml{font-size:.63rem;font-weight:600;color:var(--text);text-align:left!important;background:transparent!important;cursor:default!important;padding-left:.4rem!important;white-space:nowrap;}
.hml:hover{transform:none!important;box-shadow:none!important}

/* REGION/CAT BARS */
.reg-bar-wrap{margin-bottom:.5rem;cursor:pointer}
.reg-bar-wrap:hover .reg-bar-fill{filter:brightness(1.08)}
.reg-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.25rem}
.reg-lbl{font-size:.64rem;color:var(--text);font-weight:600}
.reg-val{font-size:.62rem;font-family:'DM Mono',monospace;color:var(--muted)}
.reg-track{height:7px;background:rgba(0,0,0,.07);border-radius:6px;overflow:hidden}
.reg-bar-fill{height:100%;border-radius:6px;transition:width 1.1s cubic-bezier(.4,0,.2,1),filter .2s}

.cat-bar{margin-bottom:.65rem;cursor:pointer}
.cat-bar:hover .cat-fill{filter:brightness(1.1)}
.cat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.28rem}
.cat-name{font-size:.65rem;font-weight:600;color:var(--text)}
.cat-amt{font-size:.62rem;font-family:'DM Mono',monospace;color:var(--muted)}
.cat-track{height:9px;background:rgba(0,0,0,.07);border-radius:6px;overflow:hidden}
.cat-fill{height:100%;border-radius:6px;transition:width 1.1s cubic-bezier(.4,0,.2,1),filter .2s}

/* TOOLTIP */
#tip{
  position:fixed;pointer-events:none;z-index:9999;
  background:rgba(255,255,255,0.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.98);
  box-shadow:0 6px 28px rgba(0,0,0,.13),0 2px 8px rgba(0,0,0,.07);
  border-radius:12px;padding:.6rem .8rem;min-width:155px;
  opacity:0;transform:translateY(5px) scale(0.97);transition:opacity .16s,transform .16s;
}
#tip.show{opacity:1;transform:translateY(0) scale(1)}
.tip-title{font-size:.7rem;font-weight:700;color:var(--text);margin-bottom:.4rem;letter-spacing:-.01em}
.tip-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.2rem}
.tip-label{font-size:.6rem;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:.28rem}
.tip-val{font-size:.63rem;font-family:'DM Mono',monospace;font-weight:700}
.tip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tip-divider{height:1px;background:var(--border);margin:.3rem 0}

/* ANIMATIONS */
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card,.kpi{animation:fadeup .45s ease both}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.3);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.55)}
</style>
</head>
<body>
<div class="page">

  <div class="hdr">
    <div class="brand">
      <div class="flag">🇮🇳</div>
      <div class="brand-text">
        <h1>India Shipping Dashboard</h1>
        <p>Sales &amp; Logistics Analytics · 2025</p>
      </div>
    </div>
    <div class="hdr-r">
      <div class="filt">
        <button class="fbtn on" data-filter="all" onclick="setFilter('all',this)">All India</button>
        <button class="fbtn" data-filter="North" onclick="setFilter('North',this)">North</button>
        <button class="fbtn" data-filter="South" onclick="setFilter('South',this)">South</button>
        <button class="fbtn" data-filter="East" onclick="setFilter('East',this)">East</button>
        <button class="fbtn" data-filter="West" onclick="setFilter('West',this)">West</button>
      </div>
      <label class="upload-btn">
        <span>⬆ Upload Excel</span>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="handleUpload(this)"/>
      </label>
      <span id="dataBadge" class="data-badge"></span>
      <span id="clk" class="clk"></span>
    </div>
  </div>

  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="row r2" style="margin-bottom:.7rem">
    <div class="card">
      <div class="ch">
        <span class="ct"><span class="ct-dot" style="background:var(--c1)"></span>Revenue by Category</span>
        <span class="cbdg" id="catBadge">3 Categories</span>
      </div>
      <div id="catBars"></div>
    </div>
    <div class="card">
      <div class="ch">
        <span class="ct"><span class="ct-dot" style="background:var(--c5)"></span>Revenue by Region</span>
        <span class="cbdg" id="regBadge">4 Regions</span>
      </div>
      <div id="regBars"></div>
    </div>
  </div>

  <div class="row r3" style="margin-bottom:.7rem">
    <div class="card">
      <div class="ch">
        <span class="ct"><span class="ct-dot" style="background:var(--c2)"></span>Customer Segment</span>
        <span class="cbdg">Donut</span>
      </div>
      <div class="donut-wrap">
        <canvas id="cSeg" role="img" aria-label="Customer segment revenue breakdown"></canvas>
      </div>
      <div class="dl" id="dSeg"></div>
    </div>

    <div class="card">
      <div class="ch">
        <span class="ct"><span class="ct-dot" style="background:var(--c4)"></span>Ship Mode Split</span>
        <span class="cbdg">Donut</span>
      </div>
      <div class="donut-wrap">
        <canvas id="cSM" role="img" aria-label="Shipping mode revenue split"></canvas>
      </div>
      <div class="dl" id="dSM"></div>
    </div>

    <div class="card">
      <div class="ch">
        <span class="ct"><span class="ct-dot" style="background:var(--c3)"></span>Revenue by State</span>
        <span class="cbdg" id="stBadge">20 States</span>
      </div>
      <div class="state-grid" id="stateGrid"></div>
    </div>
  </div>

  <div class="sec">Cross-Dimensional Heatmaps</div>
  <div class="row r2">
    <div class="card">
      <div class="ch">
        <span class="ct"><span class="ct-dot" style="background:var(--c1)"></span>Segment × Region Revenue</span>
        <span class="cbdg">Heatmap</span>
      </div>
      <div class="hm-wrap"><div id="hm1"></div></div>
    </div>
    <div class="card">
      <div class="ch">
        <span class="ct"><span class="ct-dot" style="background:var(--c2)"></span>Category × Region Revenue</span>
        <span class="cbdg">Heatmap</span>
      </div>
      <div class="hm-wrap"><div id="hm2"></div></div>
    </div>
  </div>

</div>

<div id="tip"></div>

<script>
// ── BASE DATA ──
let BASE = {
  kpi:{orders:10048,rev:1363322299,profit:238150582,qty:66031,aov:20646},
  cat:{l:['Electronics','Furniture','Office Supplies'],s:[619821530,628234476,115266293]},
  seg:{l:['Consumer','Corporate','Home Office'],s:[462000538,442695046,458626715]},
  sm:{l:['Express','Same Day','Standard'],c:[457064941,462037612,444219746]},
  // FIX: reg now includes 'q' (qty per region) consistently
  reg:{l:['East','North','South','West'],s:[339975082,350453082,332461478,340432657],o:[2494,2524,2526,2504],q:[16467,16982,16123,16459]},
  st:{
    'Andhra Pradesh':{s:68430074,r:'South'},'Assam':{s:70595402,r:'East'},'Bihar':{s:64780527,r:'East'},
    'Delhi':{s:67467495,r:'North'},'Goa':{s:72896268,r:'West'},'Gujarat':{s:66188089,r:'West'},
    'Haryana':{s:70188460,r:'North'},'Himachal Pradesh':{s:71520566,r:'North'},'Jharkhand':{s:68607932,r:'East'},
    'Karnataka':{s:66051213,r:'South'},'Kerala':{s:66000614,r:'South'},'Madhya Pradesh':{s:61156387,r:'West'},
    'Maharashtra':{s:72127999,r:'West'},'Odisha':{s:70800855,r:'East'},'Punjab':{s:68784273,r:'North'},
    'Rajasthan':{s:68063914,r:'North'},'Tamil Nadu':{s:66294119,r:'South'},'Telangana':{s:65685458,r:'South'},
    'Uttar Pradesh':{s:72492288,r:'North'},'West Bengal':{s:65190366,r:'East'}
  },
  hm1:{
    rows:['Consumer','Corporate','Home Office'],cols:['East','North','South','West'],
    data:[[113435412,117796736,114523028,116245362],[115184508,116398383,101136796,109975359],[111355162,116257963,116801654,114211936]]
  },
  hm2:{
    rows:['Electronics','Furniture','Office Supplies'],cols:['East','North','South','West'],
    data:[[151027281,168557364,146964398,153272487],[159168775,153618162,158116846,157330693],[29779026,28277556,27380234,29829477]]
  }
};

const REGION_COLORS={North:'#3b6aea',South:'#16a34a',East:'#d97706',West:'#7c3aed'};
let activeFilter='all';
let charts={};

// ── UTILS ──
function INR(v){
  if(v>=1e7)return'₹'+(v/1e7).toFixed(2)+'Cr';
  if(v>=1e5)return'₹'+(v/1e5).toFixed(1)+'L';
  return'₹'+Math.round(v).toLocaleString('en-IN');
}
function INRFull(v){return'₹'+Math.round(v).toLocaleString('en-IN')}
function rba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}
function pct(a,b){return b?((a/b)*100).toFixed(1)+'%':'0%'}

// ── TOOLTIP ──
const tipEl=document.getElementById('tip');
function showTip(e,title,rows){
  let html=`<div class="tip-title">${title}</div><div class="tip-divider"></div>`;
  rows.forEach(([lbl,val,col])=>{
    html+=`<div class="tip-row"><span class="tip-label">${col?`<span class="tip-dot" style="background:${col}"></span>`:''}${lbl}</span><span class="tip-val">${val}</span></div>`;
  });
  tipEl.innerHTML=html;tipEl.classList.add('show');moveTip(e);
}
function moveTip(e){
  const x=e.clientX,y=e.clientY,w=tipEl.offsetWidth||180,h=tipEl.offsetHeight||90;
  let tx=x+14,ty=y-10;
  if(tx+w>window.innerWidth-12)tx=x-w-14;
  if(ty+h>window.innerHeight-12)ty=y-h-10;
  tipEl.style.left=tx+'px';tipEl.style.top=ty+'px';
}
function hideTip(){tipEl.classList.remove('show')}
document.addEventListener('mousemove',e=>{if(tipEl.classList.contains('show'))moveTip(e)});

// ── KPI ──
function renderKPI(d){
  const margin=d.kpi.rev>0?pct(d.kpi.profit,d.kpi.rev):'0%';
  const items=[
    {k:'k1',ico:'📦',lbl:'Total Orders',val:d.kpi.orders.toLocaleString('en-IN'),sub:'Shipments processed',bar:72,bdg:'Active'},
    {k:'k2',ico:'💰',lbl:'Total Revenue',val:INR(d.kpi.rev),sub:INRFull(d.kpi.rev),bar:88,bdg:'Revenue'},
    {k:'k3',ico:'📈',lbl:'Total Profit',val:INR(d.kpi.profit),sub:`Margin ${margin}`,bar:65,bdg:'P&L'},
    {k:'k4',ico:'🛒',lbl:'Units Sold',val:d.kpi.qty.toLocaleString('en-IN'),sub:'Total quantity',bar:80,bdg:'Units'},
    {k:'k5',ico:'⚡',lbl:'Avg Order Value',val:INR(d.kpi.aov),sub:'Per unit sold',bar:55,bdg:'AOV'},
  ];
  document.getElementById('kpiGrid').innerHTML=items.map(it=>`
    <div class="kpi ${it.k}">
      <div class="kpi-top"><div class="kpi-ico">${it.ico}</div><span class="kpi-bdg">${it.bdg}</span></div>
      <div class="kpi-lbl">${it.lbl}</div>
      <div class="kpi-val">${it.val}</div>
      <div class="kpi-sub">${it.sub}</div>
      <div class="kpi-bw"><div class="kpi-bar" style="width:0%" data-w="${it.bar}%"></div></div>
    </div>`).join('');
  setTimeout(()=>document.querySelectorAll('.kpi-bar').forEach(b=>b.style.width=b.dataset.w),80);
}

// ── CATEGORY BARS ──
const CAT_COLORS=['#3b6aea','#7c3aed','#16a34a','#d97706','#e53e3e'];
function buildCat(d){
  const max=Math.max(...d.cat.s,1);
  const total=d.cat.s.reduce((a,b)=>a+b,0)||1;
  document.getElementById('catBadge').textContent=d.cat.l.length+' Categories';
  document.getElementById('catBars').innerHTML=d.cat.l.map((lbl,i)=>`
    <div class="cat-bar"
      onmouseenter="showTip(event,'${lbl}',[['Revenue','${INR(d.cat.s[i])}','${CAT_COLORS[i%CAT_COLORS.length]}'],['Share','${pct(d.cat.s[i],total)}']])"
      onmouseleave="hideTip()">
      <div class="cat-top"><span class="cat-name">${lbl}</span><span class="cat-amt">${INR(d.cat.s[i])} · ${pct(d.cat.s[i],total)}</span></div>
      <div class="cat-track"><div class="cat-fill" style="width:0%;background:${CAT_COLORS[i%CAT_COLORS.length]};opacity:.82" data-w="${(d.cat.s[i]/max*100).toFixed(1)}%"></div></div>
    </div>`).join('');
  setTimeout(()=>document.querySelectorAll('.cat-fill').forEach(b=>b.style.width=b.dataset.w),80);
}

// ── DONUT CENTER TEXT PLUGIN ──
const centerTextPlugin={
  id:'centerText',
  afterDraw(chart){
    if(chart.config.type!=='doughnut')return;
    const meta=chart.getDatasetMeta(0);
    if(!meta||!meta.data||!meta.data.length)return;
    const total=chart.data.datasets[0].data.reduce((a,b)=>a+(+b||0),0);
    const {x,y}=meta.data[Math.floor(meta.data.length/2)]||meta.data[0];
    const {ctx}=chart;
    ctx.save();
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#0f172a';ctx.font='700 12px DM Sans,sans-serif';
    ctx.fillText('Revenue',x,y-9);
    ctx.fillStyle='#4b5563';ctx.font='500 11px DM Mono,monospace';
    ctx.fillText('₹'+(total/10000000).toFixed(1)+'Cr',x,y+8);
    ctx.restore();
  }
};
Chart.register(centerTextPlugin);

// ── DONUT CHARTS ──
// FIX: use single key = canvasId for chart registry (was double-keyed before)
const SEG_COLORS=['#3b6aea','#16a34a','#d97706'];
const SM_COLORS=['#7c3aed','#e53e3e','#0891b2'];

function buildDonut(canvasId,legendId,labels,values,colors){
  // Destroy any existing chart on this canvas
  if(charts[canvasId]){try{charts[canvasId].destroy()}catch(e){}; delete charts[canvasId];}
  const total=values.reduce((a,b)=>a+b,0)||1;
  const hoverColors=colors.map(c=>{
    const r=Math.min(255,parseInt(c.slice(1,3),16)+38);
    const g=Math.min(255,parseInt(c.slice(3,5),16)+38);
    const b=Math.min(255,parseInt(c.slice(5,7),16)+38);
    return`rgb(${r},${g},${b})`;
  });
  const chart=new Chart(document.getElementById(canvasId),{
    type:'doughnut',
    data:{
      labels,
      datasets:[{data:values,backgroundColor:colors,hoverBackgroundColor:hoverColors,
        borderColor:'rgba(255,255,255,.85)',hoverBorderColor:'#fff',
        borderWidth:2.5,hoverBorderWidth:3.5,hoverOffset:12,borderRadius:3,spacing:2}]
    },
    options:{
      cutout:'65%',responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          enabled:true,
          backgroundColor:'rgba(255,255,255,.96)',titleColor:'#0f172a',bodyColor:'#4b5563',
          borderColor:'rgba(255,255,255,.98)',borderWidth:1,padding:11,cornerRadius:11,
          displayColors:true,boxWidth:9,boxHeight:9,boxPadding:4,
          titleFont:{size:12,weight:'700',family:'DM Sans,sans-serif'},
          bodyFont:{size:11,family:'DM Mono,monospace'},
          callbacks:{title:ctx=>ctx[0].label,label:ctx=>`  ${INR(ctx.raw)}  (${pct(ctx.raw,total)})`}
        }
      },
      animation:{animateRotate:true,animateScale:false,duration:800,easing:'easeOutQuart'},
      onHover:(evt,elements,ch)=>{ch.canvas.style.cursor=elements.length?'pointer':'default';}
    }
  });

  document.getElementById(legendId).innerHTML=labels.map((lbl,i)=>`
    <div class="dl-r" id="${legendId}-r${i}"
      onmouseenter="hlDonut('${canvasId}','${legendId}',${i},true,event,'${lbl}',${values[i]},${total},'${colors[i]}')"
      onmouseleave="hlDonut('${canvasId}','${legendId}',${i},false,event)">
      <span class="dl-dot" style="background:${colors[i]}"></span>
      <span class="dl-lbl">${lbl}</span>
      <span class="dl-cnt">${INR(values[i])}</span>
      <span class="dl-pct">${pct(values[i],total)}</span>
    </div>`).join('');

  charts[canvasId]=chart;
}

function hlDonut(canvasId,legendId,idx,isHover,evt,lbl,val,total,col){
  const chart=charts[canvasId];if(!chart)return;
  const meta=chart.getDatasetMeta(0);
  if(isHover){
    meta.data.forEach((arc,i)=>{arc.options.offset=(i===idx)?12:0;arc.options.borderWidth=(i===idx)?4:2;});
    document.querySelectorAll(`#${legendId} .dl-r`).forEach((row,i)=>{row.style.opacity=(i===idx)?'1':'0.42';row.style.transition='opacity .18s';});
    chart.update('none');
    showTip(evt,lbl,[['Revenue',INR(val),col],['Share',pct(val,total)]]);
  }else{
    meta.data.forEach(arc=>{arc.options.offset=0;arc.options.borderWidth=2.5;});
    document.querySelectorAll(`#${legendId} .dl-r`).forEach(row=>{row.style.opacity='1';});
    chart.update('none');hideTip();
  }
}

// ── REGION BARS ──
// FIX: region bar tooltip now shows 'States' count correctly from .o array
function buildReg(d){
  const max=Math.max(...d.reg.s,1);
  const total=d.reg.s.reduce((a,b)=>a+b,0)||1;
  document.getElementById('regBadge').textContent=d.reg.l.length+(d.reg.l.length===1?' Region':' Regions');
  document.getElementById('regBars').innerHTML=d.reg.l.map((r,i)=>{
    const col=REGION_COLORS[r]||'#3b6aea';
    const stateCount=d.reg.o[i]!==undefined?d.reg.o[i]:'—';
    return`<div class="reg-bar-wrap"
      onmouseenter="showTip(event,'${r} Region',[['Revenue','${INR(d.reg.s[i])}','${col}'],['Share','${pct(d.reg.s[i],total)}'],['States','${stateCount}']])"
      onmouseleave="hideTip()">
      <div class="reg-top">
        <span class="reg-lbl" style="color:${col}">${r}</span>
        <span class="reg-val">${INR(d.reg.s[i])} · ${pct(d.reg.s[i],total)}</span>
      </div>
      <div class="reg-track"><div class="reg-bar-fill" style="width:0%;background:${col};opacity:.78" data-w="${(d.reg.s[i]/max*100).toFixed(1)}%"></div></div>
    </div>`;
  }).join('');
  setTimeout(()=>document.querySelectorAll('.reg-bar-fill').forEach(b=>b.style.width=b.dataset.w),80);
}

// ── STATE GRID ──
function buildStateGrid(stData){
  const entries=Object.entries(stData).sort((a,b)=>b[1].s-a[1].s);
  const max=entries[0]?entries[0][1].s:1;
  document.getElementById('stBadge').textContent=entries.length+' States';
  document.getElementById('stateGrid').innerHTML=entries.map(([name,v])=>{
    const col=REGION_COLORS[v.r]||'#3b6aea';
    const intensity=0.32+((v.s/max)*0.58);
    return`<div class="st-cell" style="background:${rba(col,intensity)}"
      onmouseenter="showTip(event,'${name}',[['Revenue','${INR(v.s)}','${col}'],['Region','${v.r}','${col}']])"
      onmouseleave="hideTip()">
      <div class="st-name">${name}</div>
      <div class="st-val">${INR(v.s)}</div>
    </div>`;
  }).join('');
}

// ── HEATMAP ──
function buildHM(cid,hd,fromC,toC){
  const vals=hd.data.flat();
  const mn=Math.min(...vals),mx=Math.max(...vals)||1,tot=vals.reduce((a,b)=>a+b,0)||1;
  const sc=d3.scaleSequential([mn,mx],d3.interpolate(fromC,toC));
  let h=`<table class="hm-table"><thead><tr><th></th>`;
  hd.cols.forEach(c=>{h+=`<th>${c}</th>`});
  h+=`</tr></thead><tbody>`;
  hd.rows.forEach((row,ri)=>{
    h+=`<tr><td class="hml">${row}</td>`;
    hd.cols.forEach((col,ci)=>{
      const v=hd.data[ri][ci];
      const t=mx>mn?(v-mn)/(mx-mn):0.5;
      const tc=t>0.5?'rgba(255,255,255,.95)':'#0f172a';
      h+=`<td style="background:${sc(v)};color:${tc}"
        onmouseenter="showTip(event,'${row} · ${col}',[['Revenue','${INR(v)}','${toC}'],['Share','${(v/tot*100).toFixed(1)}%']])"
        onmouseleave="hideTip()">${INR(v)}</td>`;
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table>`;
  document.getElementById(cid).innerHTML=h;
}

// ── FILTER ──
// FIX: filter now correctly computes filtered heatmaps using filtered rows only
// and region bar shows correct single-region data with proper state counts
function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function computeD(){
  if(activeFilter==='all')return JSON.parse(JSON.stringify(BASE));
  const r=activeFilter;
  // Filter states
  const stF=Object.fromEntries(Object.entries(BASE.st).filter(([,v])=>v.r===r));
  const totR=Object.values(stF).reduce((a,v)=>a+v.s,0);
  const ri=BASE.reg.l.indexOf(r);
  // Orders: proportional to revenue share
  const revShare=totR/(BASE.kpi.rev||1);
  const oCount=Math.round(BASE.kpi.orders*revShare);
  // Qty from region data or fallback
  const regQty=ri!==-1?BASE.reg.q[ri]:Math.round(BASE.kpi.qty*revShare);
  const regAOV=regQty>0?Math.round(totR/regQty):0;
  const stateCount=Object.keys(stF).length;

  // Category split for this region from hm2
  const ciR=BASE.hm2.cols.indexOf(r);
  const catS=ciR!==-1?BASE.hm2.rows.map((row,ri2)=>BASE.hm2.data[ri2][ciR]):BASE.cat.s.map(v=>Math.round(v*revShare));

  // Segment split for this region from hm1
  const siR=BASE.hm1.cols.indexOf(r);
  const segS=siR!==-1?BASE.hm1.rows.map((row,ri2)=>BASE.hm1.data[ri2][siR]):BASE.seg.s.map(v=>Math.round(v*revShare));

  // Ship mode proportional
  const smC=BASE.sm.c.map(v=>Math.round(v*revShare));

  // FIX: Heatmaps for filtered region — show all segments/categories but only this region column
  // This gives meaningful single-region breakdown
  const hm1Filtered={
    rows:BASE.hm1.rows,
    cols:[r],
    data:BASE.hm1.rows.map((row,ri2)=>[BASE.hm1.data[ri2][BASE.hm1.cols.indexOf(r)]||0])
  };
  const hm2Filtered={
    rows:BASE.hm2.rows,
    cols:[r],
    data:BASE.hm2.rows.map((row,ri2)=>[BASE.hm2.data[ri2][BASE.hm2.cols.indexOf(r)]||0])
  };

  return{
    kpi:{orders:oCount,rev:totR,profit:Math.round(totR*0.1748),qty:regQty,aov:regAOV},
    cat:{l:BASE.cat.l,s:catS},
    seg:{l:BASE.seg.l,s:segS},
    sm:{l:BASE.sm.l,c:smC},
    // FIX: reg for filtered view — include state count in .o[0]
    reg:{l:[r],s:[totR],o:[stateCount],q:[regQty]},
    st:stF,
    hm1:hm1Filtered,
    hm2:hm2Filtered
  };
}

// ── RENDER ──
function render(){
  const d=computeD();
  // Cleanly destroy donut charts before re-render
  ['cSeg','cSM'].forEach(id=>{
    if(charts[id]){try{charts[id].destroy()}catch(e){}; delete charts[id];}
  });
  renderKPI(d);
  buildCat(d);
  buildDonut('cSeg','dSeg',d.seg.l,d.seg.s,SEG_COLORS);
  buildDonut('cSM','dSM',d.sm.l,d.sm.c,SM_COLORS);
  buildReg(d);
  buildStateGrid(d.st);
  buildHM('hm1',d.hm1,'#eff6ff','#1d4ed8');
  buildHM('hm2',d.hm2,'#f0fdf4','#15803d');
}

// ── UPLOAD ──
const STATE_REGION={
  'Delhi':'North','Haryana':'North','Punjab':'North','Uttar Pradesh':'North','Himachal Pradesh':'North',
  'Uttarakhand':'North','Jammu and Kashmir':'North','Chandigarh':'North','Rajasthan':'North',
  'Maharashtra':'West','Gujarat':'West','Goa':'West','Madhya Pradesh':'West','Chhattisgarh':'West',
  'Tamil Nadu':'South','Kerala':'South','Karnataka':'South','Andhra Pradesh':'South','Telangana':'South','Puducherry':'South',
  'West Bengal':'East','Odisha':'East','Bihar':'East','Jharkhand':'East','Assam':'East',
  'Meghalaya':'East','Tripura':'East','Manipur':'East','Nagaland':'East','Arunachal Pradesh':'East','Mizoram':'East','Sikkim':'East'
};

function handleUpload(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      let rows;
      if(file.name.endsWith('.csv')){
        const lines=e.target.result.split('\n');
        const hdrs=lines[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(h=>h.trim().replace(/"/g,''));
        rows=lines.slice(1).filter(l=>l.trim()).map(line=>{
          const vs=line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v=>v.trim().replace(/"/g,''));
          return Object.fromEntries(hdrs.map((h,i)=>[h,vs[i]]));
        });
      }else{
        const wb=XLSX.read(e.target.result,{type:'array'});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      }
      procUpload(rows,file.name);
    }catch(err){alert('File processing error: '+err.message);}
    finally{input.value='';}
  };
  file.name.endsWith('.csv')?reader.readAsText(file):reader.readAsArrayBuffer(file);
}

function procUpload(rows,fname){
  if(!rows.length)return;
  const cols=Object.keys(rows[0]);
  const find=(...ns)=>cols.find(c=>ns.some(n=>c.toLowerCase().includes(n.toLowerCase())));
  const sc=find('state'),saC=find('sales','revenue'),prC=find('profit'),qtC=find('qty','quantity'),regC=find('region');
  const catC=find('category'),segC=find('segment'),smC=find('ship mode','shipmode','mode');
  if(!sc||!saC){alert('Minimum "State" aur "Sales" columns chahiye.\nMile: '+cols.join(', '));return;}
  let tots=0,totp=0,totq=0,totn=0;
  const stA={},catA={},segA={},smA={},hm1D={},hm2D={};
  rows.forEach(r=>{
    const st=(r[sc]||'Unknown').trim();
    const sa=parseFloat(r[saC])||0;
    const pr=prC?(parseFloat(r[prC])||sa*.175):sa*.175;
    const qt=qtC?parseInt(r[qtC])||1:1;
    const reg=regC?r[regC]:(STATE_REGION[st]||'Other');
    const cat=catC?(r[catC]||'General'):'General';
    const seg=segC?(r[segC]||'General'):'General';
    const sm=smC?(r[smC]||'Standard'):'Standard';
    if(!stA[st])stA[st]={s:0,r:reg};stA[st].s+=sa;
    catA[cat]=(catA[cat]||0)+sa;segA[seg]=(segA[seg]||0)+sa;smA[sm]=(smA[sm]||0)+sa;
    if(!hm1D[seg])hm1D[seg]={};hm1D[seg][reg]=(hm1D[seg][reg]||0)+sa;
    if(!hm2D[cat])hm2D[cat]={};hm2D[cat][reg]=(hm2D[cat][reg]||0)+sa;
    tots+=sa;totp+=pr;totq+=qt;totn++;
  });
  BASE.kpi={orders:totn,rev:Math.round(tots),profit:Math.round(totp),qty:totq,aov:totq?Math.round(tots/totq):0};
  BASE.st=stA;
  const rA={};
  Object.values(stA).forEach(v=>{if(!rA[v.r])rA[v.r]={s:0,o:0,q:0};rA[v.r].s+=v.s;rA[v.r].o++;});
  const regKeys=Object.keys(rA).sort();
  BASE.reg={l:regKeys,s:regKeys.map(k=>rA[k].s),o:regKeys.map(k=>rA[k].o),q:regKeys.map(k=>rA[k].q||0)};
  BASE.cat={l:Object.keys(catA),s:Object.values(catA)};
  BASE.seg={l:Object.keys(segA),s:Object.values(segA)};
  BASE.sm={l:Object.keys(smA),c:Object.values(smA)};
  const segments=BASE.seg.l,categories=BASE.cat.l;
  BASE.hm1={rows:segments,cols:regKeys,data:segments.map(s=>regKeys.map(r=>(hm1D[s]&&hm1D[s][r])||0))};
  BASE.hm2={rows:categories,cols:regKeys,data:categories.map(c=>regKeys.map(r=>(hm2D[c]&&hm2D[c][r])||0))};
  const badge=document.getElementById('dataBadge');
  badge.style.display='block';badge.textContent=`✓ ${fname.split('.')[0]} · ${totn.toLocaleString()} rows`;
  activeFilter='all';
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  document.querySelector('.fbtn').classList.add('on');
  render();
}

// ── CLOCK ──
function tick(){
  const n=new Date();
  document.getElementById('clk').textContent=
    n.toLocaleDateString('en-IN',{weekday:'short',month:'short',day:'numeric'})+
    ' · '+n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
tick();
const _n=new Date();
setTimeout(()=>{tick();setInterval(tick,60000);},(60-_n.getSeconds())*1000);

// ── INIT ──
render();
</script>
